<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kam's megastructure.</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="_includes/constants/styles.css" />
    <link rel="stylesheet" href="_includes/constants/content.css" />
    <script>
      (function () {
        function setInitialMode() {
          var darkModeEnabled = localStorage.getItem("darkModeEnabled");
          if (darkModeEnabled === "true" || darkModeEnabled === null) {
            document.documentElement.classList.add("dark-mode");
          } else {
            document.documentElement.classList.add("light-mode");
          }
        }
        setInitialMode();
      })();
    </script>
  </head>
  <body>
    <div class="card-container">
      <div class="main-card">
        <div id="loading-screen">
          <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
        <div class="background-container">
          <video
            class="background"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            aria-label="card background video"
          >
            <source src="_includes/assets/images/card_bg.mp4" type="video/mp4" />
          </video>
          <div class="links">
            <a href="https://discordapp.com/users/178093021131177984" target="_blank" rel="noopener" aria-label="Discord">
              <i class="fab fa-discord" aria-hidden="true"></i>
            </a>
            <a href="https://x.com/KamPersonal" target="_blank" rel="noopener" aria-label="X (Twitter)">
              <i class="fab fa-x-twitter" aria-hidden="true"></i>
            </a>
            <a
              href="https://mail.google.com/mail/?view=cm&fs=1&to=cs.villarin02@gmail.com"
              target="_blank"
              rel="noopener"
              aria-label="Email (business inquiries only)"
              data-attribute="Business inquiries only"
            >
              <i class="fas fa-envelope" aria-hidden="true"></i>
            </a>
          </div>
        </div>
        <div class="content-container"></div>
        <div class="content">
          <div class="content-spotlight" id="spotlight"></div>
          <div id="dynamic-content"></div>
        </div>
        <div class="profile-container">
          <div class="profile">
            <div class="profile-img">
              <video autoplay muted loop playsinline preload="metadata" aria-label="profile video">
                <source src="_includes/assets/images/anemos_pfp_glitch.mp4" type="video/mp4" />
              </video>
            </div>
          </div>
        </div>
      </div>
      <div
        class="toggle-board"
        id="darkModeToggle"
        role="button"
        tabindex="0"
        aria-label="Toggle dark mode"
      >
        <div class="line"></div>
        <i class="fas fa-sun" aria-hidden="true"></i>
        <i class="fas fa-moon" aria-hidden="true"></i>
        <i class="fas fa-circle" aria-hidden="true"></i>
      </div>
      <div class="right-side">
        <nav class="menu" aria-label="Pages">
          <a class="menu-icon" href="#home" data-title="Home" aria-label="Home">
            <i class="fas fa-home" aria-hidden="true"></i>
          </a>
          <a class="menu-icon" href="#blog" data-title="Blog" aria-label="Blog">
            <i class="fas fa-pen-fancy" aria-hidden="true"></i>
          </a>
          <a class="menu-icon" href="#arts" data-title="Arts" aria-label="Arts">
            <i class="fas fa-palette" aria-hidden="true"></i>
          </a>
          <a class="menu-icon" href="#philosophy" data-title="Philosophy" aria-label="Philosophy">
            <i class="fas fa-brain" aria-hidden="true"></i>
          </a>
          <a class="menu-icon" href="#archives" data-title="Archives" aria-label="Archives">
            <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
          </a>
        </nav>
        <div class="extra-information" role="status" aria-live="polite"></div>
      </div>
    </div>
    <footer>kam. 2026. all rights reserved.</footer>
    <script type="module" src="_includes/constants/main.js"></script>
    <script src="_includes/constants/scripts/lazyLoader.js"></script>
    <script src="_includes/constants/scripts/spa.js"></script>
  </body>
</html>
